name: Integration Tests (Tier 1+2)

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - 'release-*'
  workflow_dispatch:
    inputs:
      matlab-version:
        description: 'MATLAB release to use'
        required: false
        default: 'R2024b'

jobs:
  integration-tests:
    name: Run Tier 1+2 integration tests — MATLAB ${{ inputs.matlab-version || 'R2024b' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab-version || 'R2024b' }}

      - name: Run Tier 1 + 2 tests
        uses: matlab-actions/run-matlab-command@v2
        env:
          MRST_TEST_TIERS: '1 2'
          MRST_WRITE_XML: '1'
        with:
          command: |
            cd(getenv('GITHUB_WORKSPACE'));
            startup();
            mrstModule add ad-unittest;
            runPreReleaseTests('tier', [1 2], 'writeXML', true);

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration
          path: autodiff/ad-unittest/output/XML/*.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: autodiff/ad-unittest/output/XML/*.xml
          check_name: Integration Tests
