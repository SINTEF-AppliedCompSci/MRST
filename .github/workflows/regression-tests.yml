name: Regression Tests

on:
  workflow_dispatch: {}

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out MRST
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run regression tests (autodiff scenario suite)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            startup;
            runMRSTTests('regression', 'writeXML', true, 'errorOnFailure', true);

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: MRST Regression Tests
          path: '**/TestOutput/runMRSTTests/regression/XML/*.xml'
          reporter: java-junit
