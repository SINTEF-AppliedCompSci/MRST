name: Example Smoke Tests (Tier 3)

on:
  push:
    branches:
      - 'release-*'
  workflow_dispatch:
    inputs:
      matlab-version:
        description: 'MATLAB release to use'
        required: false
        default: 'R2024b'
      include-slow:
        description: 'Also run slow-tagged examples'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Standard smoke tests (excludes slow + data-required examples)
  # -----------------------------------------------------------------------
  smoke-tests:
    name: Smoke tests — ${{ matrix.module }} (MATLAB ${{ inputs.matlab-version || 'R2024b' }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Module groups — split across parallel jobs for faster feedback.
        # Add or reorganise groups as the test suite grows.
        module:
          - 'autodiff'
          - 'co2lab'
          - 'solvers'
          - 'visualization'
          - 'model-io'
          - 'modules'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab-version || 'R2024b' }}

      - name: Run example smoke tests for group '${{ matrix.module }}'
        uses: matlab-actions/run-matlab-command@v2
        timeout-minutes: 60
        env:
          MRST_WRITE_XML: '1'
          MRST_SKIP_DATA_REQUIRED: '1'
        with:
          command: |
            cd(getenv('GITHUB_WORKSPACE'));
            startup();
            mrstModule add ad-unittest;
            % Map matrix.module value to registered module names
            groupName = '${{ matrix.module }}';
            allMods   = mrstPath();
            switch groupName
                case 'autodiff'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'autodiff')), allMods));
                case 'co2lab'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'co2lab')), allMods));
                case 'solvers'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'solvers')), allMods));
                case 'visualization'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'visualization')), allMods));
                case 'model-io'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'model-io')), allMods));
                otherwise % 'modules'
                    mods = allMods(cellfun(@(m) ...
                        ~isempty(mrstPath('query', m)) && ...
                        contains(mrstPath('query', m), fullfile(pwd, 'modules')), allMods));
            end
            runPreReleaseTests('tier', 3, 'modules', mods, ...
                               'excludeTags', {'slow','data-required'}, ...
                               'writeXML', true);

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-smoke-${{ matrix.module }}
          path: autodiff/ad-unittest/output/XML/*.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: autodiff/ad-unittest/output/XML/*.xml
          check_name: Smoke Tests (${{ matrix.module }})

  # -----------------------------------------------------------------------
  # Job 2: Slow examples (optional, triggered by workflow_dispatch only)
  # -----------------------------------------------------------------------
  slow-examples:
    name: Slow examples — MATLAB ${{ inputs.matlab-version || 'R2024b' }}
    runs-on: ubuntu-latest
    if: ${{ inputs.include-slow == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ inputs.matlab-version || 'R2024b' }}

      - name: Run slow-tagged examples
        uses: matlab-actions/run-matlab-command@v2
        timeout-minutes: 180
        env:
          MRST_WRITE_XML: '1'
        with:
          command: |
            cd(getenv('GITHUB_WORKSPACE'));
            startup();
            mrstModule add ad-unittest;
            % Run ONLY the slow-tagged examples (not excluded here)
            runPreReleaseTests('tier', 3, 'excludeTags', {'data-required'}, ...
                               'writeXML', true);

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-slow-examples
          path: autodiff/ad-unittest/output/XML/*.xml
          retention-days: 14

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: autodiff/ad-unittest/output/XML/*.xml
          check_name: Slow Examples
